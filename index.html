<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aile Akşam Yemeği Oylaması</title>
  <style>
    :root {
      --ivory: #fffff0;
      --navy: #102a43;
      --green: #2f9e44;
      --line: #d7dfd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: var(--ivory);
      color: var(--navy);
      padding: 16px;
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(16, 42, 67, .08);
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px;
    }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; opacity: .9; font-size: 14px; }
    .wrap { padding: 14px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      background: #fff;
    }
    h2 { margin: 0 0 10px; font-size: 18px; }
    .users { display: grid; grid-template-columns: repeat(4, minmax(120px,1fr)); gap: 8px; }
    .u-btn {
      border: 1px solid var(--navy);
      background: #fff;
      color: var(--navy);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .u-btn.active { background: var(--navy); color: #fff; }
    .status {
      margin-top: 8px;
      border: 1px solid #cfe7d3;
      background: #edf8ef;
      border-radius: 8px;
      padding: 8px;
      font-size: 14px;
    }
    .meal { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
    .meal h3 { margin: 0; font-size: 17px; }
    .de { font-size: 14px; color: #315179; margin-top: 2px; }
    .meta { font-size: 12px; color: #58708f; margin-top: 3px; }
    .voters { font-size: 13px; margin-top: 4px; }
    .v-btn {
      border: 1px solid var(--green);
      color: var(--green);
      background: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
      min-width: 98px;
    }
    .v-btn.active { background: var(--green); color: #fff; }
    .winner {
      border: 1px solid var(--green);
      background: #eef9f0;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
    }
    @media (max-width: 720px) {
      .users { grid-template-columns: repeat(2, minmax(120px,1fr)); }
      .meal { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Aile Akşam Yemeği Oylaması</h1>
      <p>Her gün 5 yemek önerisi · kişi başı 2 oy · oylar açık.</p>
    </header>

    <div class="wrap">
      <div class="card">
        <h2>1) İsmini seç</h2>
        <div class="users" id="users"></div>
        <div class="status" id="status">Henüz giriş yapılmadı.</div>
      </div>

      <div class="card">
        <h2>2) Bugünün Önerileri (TR + DE)</h2>
        <div id="meals"></div>
      </div>

      <div class="card">
        <h2>3) Sonuç</h2>
        <div class="winner" id="winner">Henüz oy yok.</div>
      </div>
    </div>
  </div>

  <script>
    const PARTICIPANTS = ["Anne", "Baba", "Çocuk 1", "Çocuk 2"];
    const MAX_VOTES = 2;
    const today = new Date().toISOString().slice(0, 10);
    const storageKey = "dinner-vote-clean-v1";

    const DISHES = [
      { id: "tr1", c: "TR", tr: "Kuru fasulye", de: "Bohneneintopf" },
      { id: "tr2", c: "TR", tr: "Etli nohut", de: "Kichererbsen mit Fleisch" },
      { id: "tr3", c: "TR", tr: "Tavuk sote", de: "Hähnchenpfanne" },
      { id: "tr4", c: "TR", tr: "İzmir köfte", de: "Izmir Frikadellen" },
      { id: "tr5", c: "TR", tr: "Menemen", de: "Menemen" },
      { id: "tr6", c: "TR", tr: "Biber dolması", de: "Gefüllte Paprika" },
      { id: "tr7", c: "TR", tr: "Etli bezelye", de: "Erbsen mit Fleisch" },
      { id: "tr8", c: "TR", tr: "Tavuklu pilav", de: "Reis mit Hähnchen" },
      { id: "tr9", c: "TR", tr: "Fırında makarna", de: "Nudelauflauf" },
      { id: "tr10", c: "TR", tr: "Karnıyarık", de: "Gefüllte Aubergine" },
      { id: "de1", c: "DE", tr: "Şinitzel", de: "Schnitzel" },
      { id: "de2", c: "DE", tr: "Gulaş", de: "Gulasch" },
      { id: "de3", c: "DE", tr: "Peynirli Spätzle", de: "Käsespätzle" },
      { id: "de4", c: "DE", tr: "Hackbraten", de: "Hackbraten" },
      { id: "de5", c: "DE", tr: "Kartoffelgratin", de: "Kartoffelgratin" }
    ];

    let activeUser = null;
    let state = loadState();
    ensureToday();

    const usersEl = document.getElementById("users");
    const mealsEl = document.getElementById("meals");
    const statusEl = document.getElementById("status");
    const winnerEl = document.getElementById("winner");

    renderAll();

    function loadState() {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return { days: {} };
      try { return JSON.parse(raw); } catch { return { days: {} }; }
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
    }

    function ensureToday() {
      if (!state.days[today]) {
        state.days[today] = {
          mealIds: pickMeals(today, 5),
          votes: {}
        };
        saveState();
      }
    }

    function pickMeals(seed, count) {
      const arr = [...DISHES];
      const rnd = seeded(seed);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.slice(0, count).map(d => d.id);
    }

    function seeded(seed) {
      let x = 0;
      for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
      return () => {
        x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
        return ((x >>> 0) % 1000000) / 1000000;
      };
    }

    function todayData() { return state.days[today]; }
    function votesOf(user) { return todayData().votes[user] || []; }
    function dish(id) { return DISHES.find(d => d.id === id); }

    function allVoteMap() {
      const map = {};
      for (const id of todayData().mealIds) map[id] = [];
      for (const [user, list] of Object.entries(todayData().votes)) {
        list.forEach(id => map[id] && map[id].push(user));
      }
      return map;
    }

    function renderAll() {
      renderUsers();
      renderStatus();
      renderMeals();
      renderWinner();
    }

    function renderUsers() {
      usersEl.innerHTML = PARTICIPANTS.map(name =>
        `<button class="u-btn ${activeUser === name ? "active" : ""}" data-name="${name}">${name}</button>`
      ).join("");

      usersEl.querySelectorAll(".u-btn").forEach(btn => {
        btn.onclick = () => {
          activeUser = btn.dataset.name;
          renderUsers();
          renderStatus();
          renderMeals();
        };
      });
    }

    function renderStatus() {
      if (!activeUser) {
        statusEl.textContent = "Henüz giriş yapılmadı.";
        return;
      }
      const used = votesOf(activeUser).length;
      statusEl.innerHTML = `<b>${activeUser}</b> giriş yaptı. Kalan oy: <b>${MAX_VOTES - used}</b> / ${MAX_VOTES}`;
    }

    function toggleVote(id) {
      if (!activeUser) return alert("Önce ismini seç.");
      const current = [...votesOf(activeUser)];
      const has = current.includes(id);
      if (has) {
        todayData().votes[activeUser] = current.filter(x => x !== id);
      } else {
        if (current.length >= MAX_VOTES) return alert("Kişi başı 2 oy var.");
        current.push(id);
        todayData().votes[activeUser] = current;
      }
      saveState();
      renderStatus();
      renderMeals();
      renderWinner();
    }

    function renderMeals() {
      const map = allVoteMap();
      mealsEl.innerHTML = todayData().mealIds.map((id, i) => {
        const m = dish(id);
        const voters = map[id] || [];
        const isActiveVoted = activeUser ? votesOf(activeUser).includes(id) : false;
        return `
          <div class="meal">
            <div>
              <h3>${i + 1}. ${m.tr}</h3>
              <div class="de">${m.de}</div>
              <div class="meta">Ülke: ${m.c === "TR" ? "Türk" : "Alman"} · Toplam oy: ${voters.length}</div>
              <div class="voters"><b>Oy verenler:</b> ${voters.length ? voters.join(", ") : "Henüz oy yok"}</div>
            </div>
            <div>
              <button class="v-btn ${isActiveVoted ? "active" : ""}" data-id="${id}">${isActiveVoted ? "Oy Verildi" : "Oy Ver"}</button>
            </div>
          </div>
        `;
      }).join("");

      mealsEl.querySelectorAll(".v-btn").forEach(btn => btn.onclick = () => toggleVote(btn.dataset.id));
    }

    function renderWinner() {
      const list = Object.entries(allVoteMap()).map(([id, arr]) => ({ id, n: arr.length }));
      const max = Math.max(...list.map(x => x.n), 0);
      if (!max) {
        winnerEl.textContent = "Henüz oy yok.";
        return;
      }
      const winners = list.filter(x => x.n === max).map(x => dish(x.id));
      if (winners.length === 1) {
        const w = winners[0];
        winnerEl.innerHTML = `Kazanan: <b>${w.tr}</b> (${w.de}) · ${max} oy`;
      } else {
        winnerEl.innerHTML = `Beraberlik (${max} oy): ${winners.map(w => `${w.tr} (${w.de})`).join(" · ")}`;
      }
    }
  </script>
</body>
</html>
